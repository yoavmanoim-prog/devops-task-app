name: smoke-test-container
description: Run a built image locally and curl /healthz + /readyz before it's pushed anywhere
inputs:
  image:
    required: true
  port:
    required: false
    default: "8000"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        docker run -d --name smoke -p ${{ inputs.port }}:${{ inputs.port }} ${{ inputs.image }}
        for i in $(seq 1 10); do
          sleep 1
          curl --fail http://localhost:${{ inputs.port }}/healthz && break
          [ "$i" -eq 10 ] && { echo "container never became healthy"; docker logs smoke; exit 1; }
        done
        curl --fail http://localhost:${{ inputs.port }}/readyz
        docker stop smoke
