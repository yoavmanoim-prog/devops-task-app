name: dev

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
    branches: [dev]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 302954730632.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: devops-task-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install -r config/requirements.txt -r config/requirements-dev.txt
      - name: Lint
        run: ruff check --config config/pyproject.toml .
      - name: Unit tests
        run: pytest -c config/pyproject.toml --rootdir=. --cov=src --cov-report=term-missing --cov-fail-under=80

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      id-token: write # required for AWS OIDC
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: vars
        run: echo "image_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and load locally (not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: app-under-test:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: ./.github/actions/smoke-test-container
        with:
          image: app-under-test:${{ steps.vars.outputs.image_tag }}
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      - name: Build and push (GHA cache hit - same image just smoke-tested)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Also push semver tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          cache-from: type=gha

  promote-to-gitops:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 - for the patch script and the composite action below
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yoavmanoim-prog/devops-task-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops
      - name: Bump dev values
        run: |
          python3 .github/scripts/patch_gitops_values.py bump \
            --file gitops/apps/dev/values-dev.yaml \
            --repository "$ECR_REGISTRY/$ECR_REPOSITORY" \
            --tag "${{ needs.build-and-push.outputs.image_tag }}" \
            --reset-probes
      - uses: ./.github/actions/commit-and-push
        with:
          file: apps/dev/values-dev.yaml
          message: "chore: promote devops-task-app ${{ needs.build-and-push.outputs.image_tag }} to dev"
