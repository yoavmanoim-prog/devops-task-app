name: prod

# main is the production branch - no separate `prod` branch. Merging
# `staging` -> `main` (a PR within this repo) is what triggers this.
on:
  push:
    branches: [main]
    # Only merges that can actually change the image propose a deployment.
    # Without this, a README or workflow tweak merged to main triggers a
    # promotion - and with the pin guard below that promotion would fail
    # loudly for no good reason. The two go together: this keeps the workflow
    # from running when no promotion was intended, so a guard failure always
    # means something real.
    paths:
      - "src/**"
      - "config/requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
  # How you resume automated promotion after a rollback - see the guard below.
  workflow_dispatch:
    inputs:
      force:
        description: "Promote even if production is pinned by a rollback"
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-task-app
  HELM_VERSION: v4.2.3

jobs:
  promote-to-gitops:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 - for the patch script
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yoavmanoim-prog/devops-task-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops
          # Full history, NOT the default shallow depth-1 clone. The guard
          # below runs `git log -- <file>`, which has to walk back to the last
          # commit that touched that specific file. At depth 1 the only commit
          # present is the tip; if it touched some other file, git log returns
          # nothing and the guard silently passes - the exact failure it exists
          # to prevent.
          fetch-depth: 0
      # Blind writes are what make a rollback fragile: this workflow used to
      # overwrite production's tag without looking at what was already there,
      # so any merge to main erased a deliberate pin. Instead, check who wrote
      # the file last. CI's own commits say "chore: promote ...", rollback.yaml
      # writes "rollback: ...". If a human pinned production, stop.
      #
      # This is a conditional write (compare-and-swap) rather than a lock: the
      # rollback commit IS the marker, so there is no .pinned file to create,
      # and no cleanup step for someone to forget. Forcing a promotion writes a
      # normal "chore: promote" commit, which clears the pin as a side effect.
      - name: Refuse to overwrite a deliberate pin
        if: ${{ !inputs.force }}
        working-directory: gitops
        run: |
          LAST=$(git log -1 --format=%s -- apps/prod/values-production.yaml)
          echo "last writer: ${LAST:-<none>}"
          case "$LAST" in
            rollback:*)
              echo "::error::Production is pinned by a rollback: $LAST"
              echo "::error::Someone rolled production back on purpose, and promoting now would undo it."
              echo "::error::If that rollback is resolved and you do want to ship forward, re-run this"
              echo "::error::workflow manually (Actions -> prod -> Run workflow) with force = true."
              exit 1
              ;;
          esac
      - name: Read staging's current image tag
        id: source
        run: |
          TAG=$(python3 .github/scripts/patch_gitops_values.py read-tag \
            --file gitops/apps/dev/values-staging.yaml)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/verify-ecr-tag
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          tag: ${{ steps.source.outputs.tag }}
          region: ${{ env.AWS_REGION }}
      - name: Promote staging's tag to production
        run: |
          python3 .github/scripts/patch_gitops_values.py promote \
            --source gitops/apps/dev/values-staging.yaml \
            --target gitops/apps/prod/values-production.yaml \
            --reset-probes
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Render chart with the patched values (fail fast if broken)
        run: |
          helm template production gitops/charts/app \
            -f gitops/apps/prod/values-production.yaml > /dev/null
      - uses: ./.github/actions/commit-and-push
        with:
          file: apps/prod/values-production.yaml
          message: "chore: promote staging's image tag to production"
