# actionlint has no Marketplace "Verified Creator" listing (individual
# maintainer, not an official vendor org) - consistent with this repo's
# action-selection priority, it's installed as a pinned, checksum-verified
# binary rather than pulled in as a third-party Action.
name: lint

on:
  pull_request:
  push:
    branches: [dev, staging, prod, main]

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        run: ./actionlint -color
